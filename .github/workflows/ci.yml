name: Foundation checks
on:
  pull_request:
  push:
    branches: [main, staging]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run secrets:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
  postgres-policies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: compass_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-test-only@127.0.0.1:5432/compass_test
      - name: Rehearse synthetic backup and restore with RLS
        run: node --experimental-strip-types scripts/verify-synthetic-recovery.mjs
        env:
          TEST_DATABASE_URL: postgresql://postgres:synthetic-test-only@127.0.0.1:5432/compass_test
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
